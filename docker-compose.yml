services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: smartdialer
      POSTGRES_PASSWORD: smartdialer
      POSTGRES_DB: smartdialer
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdialer"]
      interval: 2s
      timeout: 2s
      retries: 20
